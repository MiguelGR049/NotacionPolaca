<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Notacion Polaca
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <div class="row mb-3 justify-content-center">
            <div class="card justify-content-center" style="width: 25rem; background-color: rgba(255, 255, 255, 0.5);">
                <h1 class="fw-bold text-center">
                    Notacion Polaca
                </h1>
                <div class="card-body row justify-content-center">

                    <label class="fw-bold" for="operacion_np">Ingresa una operacion en NP</label>
                    <textarea name="operacion_np" id="operacion_np" class="form-control mb-3" rows="3"></textarea>

                    <button id="btn_resolver" class="btn btn-primary mb-3">Resolver</button>

                    <label class="col mt-2" for="normal">Normal</label>
                    <input type="text" id="normal" name="normal" class="form-control mb-3">

                    <label class="col mt-2" for="resultado">Resultado</label>
                    <input type="text" id="resultado" name="resultado" class="form-control mb-3">

                    <div class="row justify-content-center mb-3">
                        <div class="col-6">
                            <button id="btn_almacenar" class="btn btn-success w-100">Almacenar</button>
                        </div>
                        <div class="col-6">
                            <button id="btn_limpiar" class="btn btn-warning w-100">Limpiar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./bundle.js"></script>
</body>
</html>
